name: Canary Debian Trixie image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    uses: proof-computer/liskov-github-actions/.github/workflows/runtime-image.yml@v1
    with:
      application-id: liskov-runtime-images-v5-canary
      manifest-path: .liskov/canary-debian-trixie.json
      image-url: https://github.com/proof-computer/liskov-runtime-images/releases/download/v0.1.0-rc.7/liskov-runtime-image-debian-trixie-aarch64.tar.xz
      expected-sha256: e7c6b9295e37848ca06c02cd6c3037fc7c28e4b26e064a60d2eaec38eac36b0a
