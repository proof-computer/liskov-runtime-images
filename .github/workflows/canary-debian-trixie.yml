name: Canary Debian Trixie image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    uses: proof-computer/liskov-github-actions/.github/workflows/runtime-image.yml@v1
    with:
      application-id: liskov-runtime-images-v5-canary
      manifest-path: .liskov/canary-debian-trixie.json
      image-url: https://github.com/proof-computer/liskov-runtime-images/releases/download/v0.1.0-rc.2/liskov-runtime-image-debian-trixie-aarch64.tar.xz
      expected-sha256: 2343bc1c4f4cb2f381ccf06998a00f519bcda4d6d9134d1061b8bfadd64c1177
