name: Canary Debian Trixie image

on:
  workflow_dispatch:

permissions:
  attestations: read
  contents: read
  id-token: write

jobs:
  upload:
    uses: proof-computer/liskov-github-actions/.github/workflows/runtime-image.yml@v1
    with:
      application-id: liskov-runtime-images-v5-canary
      manifest-path: .liskov/canary-debian-trixie.json
      image-url: https://github.com/proof-computer/liskov-runtime-images/releases/download/v0.1.0-rc.12/liskov-runtime-image-debian-trixie-aarch64.tar.xz
      expected-sha256: 0639e88db6b46cef6091acafe35dfb1b59c5e354463d969f1a9509451d118377
      attestation-repository: proof-computer/liskov-runtime-images
      attestation-source-digest: d3a7b61e7e2acb2e2f686c6fc1379d2ee74ea582
      attestation-signer-workflow: proof-computer/liskov-runtime-images/.github/workflows/ci.yml
