name: Canary Debian Trixie image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    uses: proof-computer/liskov-github-actions/.github/workflows/runtime-image.yml@v1
    with:
      application-id: liskov-runtime-images-v5-canary
      manifest-path: .liskov/canary-debian-trixie.json
      image-url: https://github.com/proof-computer/liskov-runtime-images/releases/download/v0.1.0-rc.3/liskov-runtime-image-debian-trixie-aarch64.tar.xz
      expected-sha256: af7e98ffdf03e56194359a97b8daa971dc5bc9bc8016652fafcb1fc2e648cbc8
