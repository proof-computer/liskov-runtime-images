name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate tag-bound release intent
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/change-classifier.py validate-release-intent \
            --release-tag "${TAG}"

      - name: Locate exact successful release qualification
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_NAME: release-bundle-${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t candidate_runs < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=100" \
              --jq '.workflow_runs[].id'
          )
          release_run_id=
          for candidate_run_id in "${candidate_runs[@]}"; do
            artifact_count=$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/artifacts" \
                --jq "[.artifacts[] | select(.name == \"${BUNDLE_NAME}\" and .expired == false)] | length"
            )
            if [[ "${artifact_count}" == "1" ]]; then
              release_run_id="${candidate_run_id}"
              break
            fi
          done
          if [[ -z "${release_run_id}" ]]; then
            echo "no unexpired successful release-mode bundle exists for ${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "run-id=${release_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download exact qualified bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ steps.qualification.outputs.run-id }}
          BUNDLE_NAME: release-bundle-${{ github.sha }}
        run: |
          set -euo pipefail
          gh run download "${RELEASE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${BUNDLE_NAME}" \
            --dir release

      - name: Verify manifest, checksums, targets, and qualification identity
        env:
          RELEASE_RUN_ID: ${{ steps.qualification.outputs.run-id }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          material_fingerprint=$(
            python3 scripts/change-classifier.py fingerprint
          )
          python3 scripts/build-manifest.py validate \
            --bundle-dir release \
            --repository "${GITHUB_REPOSITORY}" \
            --source-commit "${GITHUB_SHA}" \
            --material-fingerprint "${material_fingerprint}" \
            --version "${TAG}" \
            --workflow-path ".github/workflows/ci.yml" \
            --workflow-run-id "${RELEASE_RUN_ID}"

      - name: Verify every source-bound attestation
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_WORKFLOW: proof-computer/liskov-runtime-images/.github/workflows/ci.yml
        run: |
          set -euo pipefail
          for file in release/*; do
            gh attestation verify "${file}" \
              --repo "${GITHUB_REPOSITORY}" \
              --source-digest "${GITHUB_SHA}" \
              --signer-workflow "${SIGNER_WORKFLOW}"
          done

      - name: Publish unchanged qualified files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          helper_version=$(jq -er '.helper.version' sources.lock.json)
          if [[ "${TAG}" == *-rc.* ]]; then
            debian_status="release candidate; promotion remains gated on the bounded Acurast A/B canary"
          else
            debian_status="maintained OCI-derived image, promoted after its bounded Acurast A/B canary"
          fi
          {
            echo "Digest-pinned AArch64 rootfs images for Liskov-managed Acurast Cargo/PRoot workloads."
            echo
            echo "- \`debian-trixie\` is the ${debian_status}."
            echo "- \`v4-control\` is retained only as the Termux v4.30.1/Acurast compatibility control."
            echo "- Every image embeds the exact Apache-2.0 \`liskov-runtime-contact\` v${helper_version} binary plus the source and AArch64 shared object for the documented Acurast \`getifaddrs\` override, and publishes an SPDX SBOM, file inventory, overlay ledger, provenance record, commit-bound build manifest, checksums, and GitHub attestation."
            echo
            echo "Verify \`SHA256SUMS\`, \`BUILD-MANIFEST.json\`, and the GitHub artifact attestations before use."
          } > "${notes_file}"

          release_args=(
            release create "${TAG}"
            --repo "${GITHUB_REPOSITORY}"
            --title "${TAG}"
            --notes-file "${notes_file}"
          )
          if [[ "${TAG}" == *-rc.* ]]; then
            release_args+=(--prerelease)
          fi
          gh "${release_args[@]}" release/*
